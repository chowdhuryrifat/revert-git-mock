<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueueStorm · Ticket Classifier</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      color: #1a1a2e;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 20px 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      color: #e94560;
      font-size: 1.5rem;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 span {
      color: #fff;
      font-weight: 300;
    }

    header .badge {
      background: #e94560;
      color: #fff;
      font-size: 0.65rem;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 24px;
    }

    main.container {
      margin-top: 32px;
      margin-bottom: 40px;
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
      padding: 28px 32px;
      margin-bottom: 24px;
    }

    .panel h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 20px;
      margin-bottom: 16px;
    }

    .form-grid .full-width {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: #555;
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 0.92rem;
      font-family: inherit;
      transition: border-color 0.2s;
      background: #fafafa;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #0f3460;
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 28px;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0f3460, #1a1a2e);
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(15,52,96,0.3);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #eaeaea;
      color: #333;
    }

    .btn-secondary:hover {
      background: #ddd;
    }

    .result-card {
      border-radius: 10px;
      border: 1.5px solid #e8e8e8;
      overflow: hidden;
    }

    .result-header {
      background: #f8f9fb;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e8e8e8;
    }

    .result-header .ticket-id {
      font-weight: 700;
      color: #1a1a2e;
    }

    .result-header .status {
      font-size: 0.75rem;
      padding: 3px 12px;
      border-radius: 20px;
      font-weight: 600;
    }

    .status-ok {
      background: #d4edda;
      color: #155724;
    }

    .status-error {
      background: #f8d7da;
      color: #721c24;
    }

    .status-warning {
      background: #fff3cd;
      color: #856404;
    }

    .health-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 24px;
      background: #f8f9fb;
      border: 1px solid #e8e8e8;
    }

    .health-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .health-dot.online {
      background: #28a745;
      box-shadow: 0 0 6px rgba(40, 167, 69, 0.4);
    }

    .health-dot.offline {
      background: #dc3545;
      box-shadow: 0 0 6px rgba(220, 53, 69, 0.4);
    }

    .health-bar .btn-icon {
      margin-left: auto;
      background: none;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.8rem;
      color: #666;
      transition: all 0.2s;
    }

    .health-bar .btn-icon:hover {
      background: #eaeaea;
    }

    .raw-json {
      margin-top: 16px;
      border-top: 1px solid #e8e8e8;
      padding-top: 12px;
    }

    .raw-json summary {
      cursor: pointer;
      font-size: 0.78rem;
      color: #888;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      user-select: none;
    }

    .raw-json pre {
      margin-top: 8px;
      background: #1a1a2e;
      color: #a0d2db;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .result-body {
      padding: 20px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .result-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .result-item.full-width {
      grid-column: 1 / -1;
    }

    .result-item .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      font-weight: 600;
    }

    .result-item .value {
      font-size: 1rem;
      font-weight: 500;
      color: #1a1a2e;
    }

    .flag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .flag-true {
      background: #f8d7da;
      color: #721c24;
    }

    .flag-false {
      background: #e8e8e8;
      color: #666;
    }

    .confidence-bar {
      height: 6px;
      background: #eee;
      border-radius: 4px;
      margin-top: 4px;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #e94560, #0f3460);
      transition: width 0.5s ease;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #888;
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #eee;
      border-top-color: #0f3460;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      background: #fef2f2;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      border: 1px solid #fecaca;
    }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: #aaa;
    }

    .empty-state svg {
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 0.92rem;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .result-grid {
        grid-template-columns: 1fr;
      }
      .panel {
        padding: 20px 16px;
      }
      header h1 {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e94560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="1"/>
          <path d="M9 14l2 2 4-4"/>
        </svg>
        QueueStorm <span>· Ticket Classifier</span>
      </h1>
      <span class="badge">Mock Preliminary</span>
    </div>
  </header>

  <main class="container">
    <div class="health-bar" id="healthBar">
      <span class="health-dot offline" id="healthDot"></span>
      <span id="healthText">Checking API health...</span>
      <button class="btn-icon" id="healthRefreshBtn" title="Refresh">↻</button>
    </div>

    <div class="panel">
      <h2>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
        New Ticket
      </h2>
      <form id="ticketForm">
        <div class="form-grid">
          <div>
            <label for="ticket_id">Ticket ID</label>
            <input type="text" id="ticket_id" readonly tabindex="-1">
          </div>
          <div>
            <label for="channel">Channel</label>
            <select id="channel">
              <option value="app">App</option>
              <option value="sms">SMS</option>
              <option value="call_center">Call Center</option>
              <option value="merchant_portal">Merchant Portal</option>
            </select>
          </div>
          <div>
            <label for="locale">Locale</label>
            <select id="locale">
              <option value="en">English</option>
              <option value="bn">Bengali</option>
              <option value="mixed">Mixed</option>
            </select>
          </div>
          <div></div>
          <div class="full-width">
            <label for="message">Message</label>
            <textarea id="message" placeholder="Describe the customer's issue..." required>I sent 5000 taka to a wrong number this morning, please help me get it back</textarea>
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
            Classify Ticket
          </button>
          <button type="button" class="btn btn-secondary" id="clearBtn">Clear</button>
        </div>
      </form>
    </div>

    <div class="panel" id="resultPanel">
      <h2>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
        Classification Result
      </h2>
      <div id="resultContent">
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <p>Submit a ticket to see the classification result.</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:'
      ? 'http://localhost:8000'
      : '/_/backend';

    const form = document.getElementById('ticketForm');
    const submitBtn = document.getElementById('submitBtn');
    const resultContent = document.getElementById('resultContent');
    const clearBtn = document.getElementById('clearBtn');
    const healthDot = document.getElementById('healthDot');
    const healthText = document.getElementById('healthText');
    const healthRefreshBtn = document.getElementById('healthRefreshBtn');

    async function checkHealth() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        if (res.ok) {
          const data = await res.json();
          healthDot.className = 'health-dot online';
          healthText.textContent = `API Online · ${data.service}`;
        } else {
          throw new Error('Not OK');
        }
      } catch {
        healthDot.className = 'health-dot offline';
        healthText.textContent = 'API Offline — server may be down';
      }
    }

    healthRefreshBtn.addEventListener('click', checkHealth);

    async function fetchNextTicketId() {
      try {
        const res = await fetch(`${API_BASE}/next-ticket-id`);
        if (res.ok) {
          const data = await res.json();
          document.getElementById('ticket_id').value = data.ticket_id;
        }
      } catch {}
    }

    checkHealth();
    fetchNextTicketId();

    clearBtn.addEventListener('click', () => {
      form.reset();
      document.getElementById('message').value = '';
      fetchNextTicketId();
      document.getElementById('resultContent').innerHTML = `
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <p>Submit a ticket to see the classification result.</p>
        </div>`;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const channel = document.getElementById('channel').value;
      const locale = document.getElementById('locale').value;
      const message = document.getElementById('message').value.trim();

      if (!message) {
        resultContent.innerHTML = `<div class="error-message">Message is required.</div>`;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Classifying...';

      resultContent.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>Classifying ticket...</p>
        </div>`;

      try {
        const res = await fetch(`${API_BASE}/sort-ticket`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ticket_id: document.getElementById('ticket_id').value, channel, locale, message }),
        });

        const rawText = await res.text();

        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${rawText}`);
        }

        const data = JSON.parse(rawText);

        const flags = {
          wrong_transfer: { icon: '↗️', label: 'Wrong Transfer' },
          payment_failed: { icon: '❌', label: 'Payment Failed' },
          refund_request: { icon: '↩️', label: 'Refund Request' },
          phishing_or_social_engineering: { icon: '🎣', label: 'Phishing / Social Engineering' },
          other: { icon: '❓', label: 'Other' },
        };

        const caseInfo = flags[data.case_type] || { icon: '❓', label: data.case_type };

        resultContent.innerHTML = `
          <div class="result-card">
            <div class="result-header">
              <span class="ticket-id">${escapeHtml(data.ticket_id)}</span>
              <span class="status status-ok">${Math.round(data.confidence * 100)}% confident</span>
            </div>
            <div class="result-body">
              <div class="result-grid">
                <div class="result-item">
                  <span class="label">Case Type</span>
                  <span class="value">${caseInfo.icon} ${caseInfo.label}</span>
                </div>
                <div class="result-item">
                  <span class="label">Severity</span>
                  <span class="value">
                    <span class="flag flag-${data.severity === 'critical' || data.severity === 'high' ? 'true' : 'false'}">${data.severity.toUpperCase()}</span>
                  </span>
                </div>
                <div class="result-item">
                  <span class="label">Department</span>
                  <span class="value">${escapeHtml(data.department.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()))}</span>
                </div>
                <div class="result-item">
                  <span class="label">Human Review</span>
                  <span class="value">
                    <span class="flag ${data.human_review_required ? 'flag-true' : 'flag-false'}">${data.human_review_required ? 'REQUIRED' : 'Not Required'}</span>
                  </span>
                </div>
                <div class="result-item full-width">
                  <span class="label">Agent Summary</span>
                  <div class="value">${escapeHtml(data.agent_summary)}</div>
                </div>
                <div class="result-item full-width">
                  <span class="label">Confidence</span>
                  <div class="value">${data.confidence.toFixed(3)}</div>
                  <div class="confidence-bar">
                    <div class="confidence-fill" style="width: ${data.confidence * 100}%"></div>
                  </div>
                </div>
              </div>
              <details class="raw-json">
                <summary>Raw JSON Response</summary>
                <pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>
              </details>
            </div>
          </div>`;
      } catch (err) {
        resultContent.innerHTML = `
          <div class="error-message">
            <strong>Error:</strong> ${escapeHtml(err.message)}
            <br><br>
            <small>Make sure the backend server is running at <code>${API_BASE}</code></small>
          </div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
          Classify Ticket`;
      }
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
